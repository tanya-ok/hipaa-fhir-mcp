name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag ancestry and versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          package_version="$(jq -r .version package.json)"
          manifest_version="$(jq -r .version manifest.json)"
          test "$TAG" = "v${package_version}"
          test "$package_version" = "$manifest_version"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

      # Node 25+ does not bundle Corepack; reads the pnpm pinned in packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: PHI sweep
        run: pnpm check:phi

      - name: Desktop bundle payload gate cases
        run: pnpm check:mcpb

      - name: Pack and verify the Desktop bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm package:mcpb "hipaa-fhir-mcp-${VERSION}.mcpb"
          sha256sum "hipaa-fhir-mcp-${VERSION}.mcpb" > "hipaa-fhir-mcp-${VERSION}.mcpb.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: |
            hipaa-fhir-mcp-${{ steps.version.outputs.version }}.mcpb
            hipaa-fhir-mcp-${{ steps.version.outputs.version }}.mcpb.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: release

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: false
