name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 25+ does not bundle Corepack; reads the pnpm pinned in packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: |
          umask 077
          if ! pnpm audit --audit-level moderate --json \
            > "$RUNNER_TEMP/dependency-audit.json" 2> "$RUNNER_TEMP/dependency-audit.stderr"; then
            printf '%s\n' '::error::Dependency audit failed; review the lockfile privately.'
            exit 1
          fi

      - name: PHI sweep
        run: pnpm check:phi

      - name: Desktop bundle payload gate cases
        run: pnpm check:mcpb
