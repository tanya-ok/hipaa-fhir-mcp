name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 25+ does not bundle Corepack; reads the pnpm pinned in packageManager
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: |
          umask 077
          if ! pnpm audit --audit-level moderate --json \
            > "$RUNNER_TEMP/dependency-audit.json" 2> "$RUNNER_TEMP/dependency-audit.stderr"; then
            printf '%s\n' '::error::Dependency audit failed; review the lockfile privately.'
            exit 1
          fi

      - name: Package demo over stdio
        run: node scripts/demo-package.mjs

      - name: PHI sweep
        run: pnpm check:phi

      - name: Desktop bundle payload gate cases
        run: pnpm check:mcpb

  risk-tier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Agent branches fail on forbidden paths or lost test assertions.
      - name: Classify the change
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          flag=""
          case "$HEAD_REF" in agent/*) flag="--agent" ;; esac
          node scripts/risk-tier.mjs "origin/$BASE_REF" HEAD $flag | tee "$RUNNER_TEMP/tier.json"
          printf '### Risk tier\n\n```json\n%s\n```\n' "$(cat "$RUNNER_TEMP/tier.json")" >> "$GITHUB_STEP_SUMMARY"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag hipaa-fhir-mcp:ci .

      - name: List tools over stdio in the container
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 3
          } | docker run --rm -i --network none \
                -e FHIR_BASE_URL=https://r4.smarthealthit.org \
                -e AUDIT_HMAC_KEY="$key" \
                hipaa-fhir-mcp:ci > "$RUNNER_TEMP/tools.jsonl"
          want="$(jq -c '[.tools[].name] | sort' manifest.json)"
          jq -se --argjson want "$want" '[.[] | select(.id == 2) | .result.tools[].name] | sort == $want' "$RUNNER_TEMP/tools.jsonl"
