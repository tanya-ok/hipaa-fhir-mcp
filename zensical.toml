[project]
site_name = "hipaa-fhir-mcp"
site_description = "Synthetic FHIR tools with bounded responses and one audit outcome per invocation."
site_url = "https://tanya-ok.github.io/hipaa-fhir-mcp/"
repo_url = "https://github.com/tanya-ok/hipaa-fhir-mcp"
repo_name = "tanya-ok/hipaa-fhir-mcp"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/overview.css"]
exclude_docs = "local-workspace-review.md"
nav = [
  { "Home" = "index.md" },
  { "Demo" = "demo.md" },
  { "Identity-enabled lab" = "kubernetes-lab.md" },
  { "Controls and limits" = "hipaa-compliance-mapping.md" },
  { "For maintainers" = [
  { "Publication readiness" = "publication-readiness.md" },
  { "Development plan" = "development-plan.md" },
  { "Hardening evidence" = "quorum-hardening-2026-10-07.md" },
  { "Security automation" = "security-automation.md" },
] },
]

[project.theme]
language = "en"
features = ["content.code.copy", "navigation.top", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
pymdownx.tasklist.custom_checkbox = true
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
